
plugins {
    id 'fabric-loom' version '1.3-SNAPSHOT'
}

group = 'com.ntf.mod'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.94.0+1.21.11'
}
      